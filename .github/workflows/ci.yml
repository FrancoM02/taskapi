name: CI

# Se dispara en pushes a main y en Pull Requests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests y calidad de código
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio en el runner
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Cache de dependencias — acelera runs posteriores
      - name: Cache de pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Instalar dependencias
      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.4.4  # Linter ultra-rápido escrito en Rust

      # 5. Linting — verifica estilo y errores obvios sin ejecutar el código
      - name: Lint con ruff
        run: ruff check app/ tests/

      # 6. Correr los tests
      - name: Tests con pytest
        run: pytest tests/ -v --tb=short

  # Job separado para build de Docker (solo en pushes a main)
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test       # Solo corre si los tests pasan
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t taskapi:${{ github.sha }} .

      # En un proyecto real, acá se haría push a un registry (Docker Hub, ECR, etc.)
      # y se deployaría a producción.
